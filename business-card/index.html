<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="웹 개발 학습자의 디지털 명함" />
    <title>웹 개발 학습자 | Digital Business Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card" aria-labelledby="name">
      <div class="card-top">
        <p class="card-label">DIGITAL BUSINESS CARD</p>
      </div>

      <div class="card-content">
        <p class="greeting">안녕하세요!</p>
        <h1 id="name">웹 개발 학습자</h1>
        <p class="role">웹 개발을 배우며 직접 만드는 사람</p>
        <p class="introduction">
          HTML, CSS, JavaScript로 작은 웹페이지를 만들며 성장하고 있습니다.
        </p>

        <div class="contact-box">
          <p class="contact-label">EMAIL</p>
          <a id="email-link" href="mailto:hello@example.com">hello@example.com</a>
          <button id="copy-email" type="button">이메일 복사</button>
          <p id="copy-message" class="copy-message" aria-live="polite"></p>
        </div>
      </div>

      <footer>Thank you for visiting.</footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
